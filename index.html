<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0b12" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f7f5fb" media="(prefers-color-scheme: light)">
  <title>Jukebox</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Righteous&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body class="guest">
  <div class="top">
    <header class="bar">
      <h1 class="brand">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg></span>
        Jukebox
      </h1>
      <button id="name-chip" type="button" class="chip"></button>
    </header>

    <section class="now card">
      <img id="now-thumb" alt="">
      <div class="info">
        <div id="now-title" class="title">Nothing playing</div>
        <div class="meta status"><span id="now-eq" hidden></span><span id="now-meta">Add a song to get started</span></div>
      </div>
      <div id="now-controls" class="controls"></div>
    </section>

    <form id="search-form" class="search" role="search">
      <span class="search-icon"></span>
      <input id="search-input" type="search" placeholder="Search songs or paste a link" required
             aria-label="Search songs or paste a YouTube link"
             enterkeyhint="search" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      <span id="search-clear"></span>
    </form>
  </div>

  <main>
    <section id="results-view" hidden>
      <div class="section-head">
        <h2 id="results-title">Results</h2>
        <button id="results-done" type="button" class="ghost small">Done</button>
      </div>
      <ul id="results" class="list"></ul>
    </section>

    <section id="queue-view">
      <div class="section-head"><h2>Up next <span id="queue-count" class="count"></span></h2></div>
      <ul id="queue" class="list"></ul>
      <p id="queue-empty" class="empty">The queue is empty. Search above to add something.</p>
    </section>
  </main>

  <dialog id="name-dialog">
    <form method="dialog">
      <h2 id="name-title">What's your name?</h2>
      <p class="meta">Shown next to the songs you add.</p>
      <input id="name-input" aria-labelledby="name-title" maxlength="30" autocomplete="nickname" enterkeyhint="done" placeholder="Your name">
      <div class="dialog-actions">
        <button type="button" class="ghost" onclick="this.closest('dialog').close('skip')">Skip</button>
        <button value="ok">Save</button>
      </div>
    </form>
  </dialog>

  <script type="module">
    import { stateRef, queueRef, onSnapshot, addDoc, deleteDoc, setDoc, query, orderBy, serverTimestamp } from './firebase.js';
    import {
      $, el, toast, youtubeId, songFromLink, search, searchEnabled, songRow, formatDuration, icon, iconButton, setIcon,
      equalizer, skeletonRows, setArt,
    } from './common.js';

    // ---- Name (asked once, remembered per device) ----
    const store = {
      get: (k) => { try { return localStorage.getItem(k); } catch { return null; } },
      set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
    };
    let myName = store.get('jukebox:name') || '';
    const nameChip = $('#name-chip');
    const renderName = () => nameChip.replaceChildren(icon('user'), el('span', { textContent: myName || 'Set name' }));
    renderName();

    const dialog = $('#name-dialog');
    function askName() {
      $('#name-input').value = myName;
      dialog.showModal();
      return new Promise((resolve) => dialog.addEventListener('close', () => {
        const value = $('#name-input').value.trim();
        if (dialog.returnValue === 'ok' && value) { myName = value; store.set('jukebox:name', value); renderName(); }
        if (!store.get('jukebox:name-asked')) store.set('jukebox:name-asked', '1');
        renderQueue();
        resolve();
      }, { once: true }));
    }
    nameChip.onclick = askName;
    const nameForSong = async () => {
      if (!myName && !store.get('jukebox:name-asked')) await askName();
      return myName || 'Guest';
    };

    // ---- Now playing + controls ----
    const toggle = iconButton('play', 'Play');
    const skip = iconButton('skip', 'Skip', { className: 'icon-btn tonal' });
    $('#now-controls').append(toggle, skip);
    $('.search-icon').append(icon('search'));
    $('#now-eq').replaceWith(Object.assign(equalizer(), { id: 'now-eq', hidden: true }));

    let playing = false, playId = null, nowVideoId = null, lastNotice;
    onSnapshot(stateRef, (snap) => {
      const s = snap.data() || {};
      const np = s.nowPlaying;
      playing = Boolean(np && s.playing);
      playId = np?.playId ?? null;
      nowVideoId = np?.videoId ?? null;
      $('#now-thumb').src = np?.thumb || '';
      $('#now-thumb').classList.toggle('placeholder', !np);
      setArt($('.now'), np?.thumb);
      $('#now-title').textContent = np ? np.title : 'Nothing playing';
      $('#now-meta').textContent = np
        ? `${playing ? '' : 'Paused · '}added by ${np.addedBy}` // the bouncing bars say "playing"
        : 'Add a song to get started';
      $('#now-eq').hidden = !np;
      $('#now-eq').classList.toggle('paused', !playing);
      setIcon(toggle, playing ? 'pause' : 'play', playing ? 'Pause' : 'Play');
      if (s.notice && lastNotice !== undefined && s.notice.at !== lastNotice) toast(s.notice.text);
      lastNotice = s.notice?.at ?? null;
      renderResults();
    });

    const send = (type, extra = {}) => setDoc(stateRef, { cmd: { type, id: crypto.randomUUID(), ...extra } }, { merge: true });
    toggle.onclick = () => send(playing ? 'pause' : 'play');
    // Tag the skip with the song we're looking at, so a double or late tap doesn't skip the next song too
    skip.onclick = () => send('skip', { playId });

    // ---- Queue ----
    let queueDocs = [];
    function renderQueue() {
      $('#queue').replaceChildren(...queueDocs.map((d, i) => {
        const song = d.data();
        const mine = song.addedBy === (myName || 'Guest');
        return songRow(song, {
          position: i + 1,
          meta: [mine ? 'You' : song.addedBy, formatDuration(song.duration)].filter(Boolean).join(' · '),
          action: mine ? iconButton('close', `Remove ${song.title}`, { className: 'icon-btn ghost', onclick: () => remove(d) }) : null,
        });
      }));
      $('#queue-count').textContent = queueDocs.length ? `(${queueDocs.length})` : '';
      $('#queue-empty').hidden = queueDocs.length > 0;
    }
    onSnapshot(query(queueRef, orderBy('createdAt')), (snap) => { queueDocs = snap.docs; renderQueue(); renderResults(); });

    // Put it back under the same ID and createdAt, so it returns to its old spot in the queue
    async function remove(d) {
      const song = d.data();
      await deleteDoc(d.ref);
      toast('Removed from queue', { label: 'Undo', onclick: () => setDoc(d.ref, song) });
    }

    async function enqueue(song) {
      const addedBy = await nameForSong();
      await addDoc(queueRef, { ...song, addedBy, createdAt: serverTimestamp() });
      // The local snapshot already includes the new song by the time the write is acknowledged
      toast(`Added · #${queueDocs.length} in queue`);
    }

    // ---- Search / paste ----
    const input = $('#search-input');
    const clearBtn = iconButton('close', 'Clear search', { className: 'icon-btn ghost small' });
    $('#search-clear').append(clearBtn);
    if (!searchEnabled) input.placeholder = 'Paste a YouTube link';

    // Results know what's already queued or playing (live, whoever added it), so nobody queues a song twice
    let found = null;
    function renderResults() {
      if (!found || $('#results-view').hidden) return;
      if (!found.length) return $('#results').replaceChildren(el('li', { className: 'empty', textContent: 'No results. Try other words or paste a link.' }));
      const queued = new Set(queueDocs.map((d) => d.data().videoId));
      $('#results').replaceChildren(...found.map((song) => {
        const status = song.videoId === nowVideoId ? 'Playing now' : queued.has(song.videoId) ? 'In queue' : null;
        const meta = [status, song.channel, formatDuration(song.duration)].filter(Boolean).join(' · ');
        if (status) return songRow(song, { meta, action: iconButton('check', status, { className: 'icon-btn tonal done', disabled: true }) });
        const add = iconButton('plus', `Add ${song.title}`, { className: 'icon-btn tonal' });
        add.onclick = async () => {
          add.disabled = true;
          try { await enqueue(song); } catch (err) { add.disabled = false; toast(`Error: ${err.message}`); }
        };
        return songRow(song, { meta, action: add });
      }));
    }

    const showResults = (on) => { $('#results-view').hidden = !on; $('#queue-view').hidden = on; };
    const closeResults = () => { input.value = ''; showResults(false); clearBtn.hidden = true; };
    clearBtn.hidden = true;
    input.addEventListener('input', () => { clearBtn.hidden = !input.value; });
    clearBtn.onclick = () => { closeResults(); input.focus(); };
    $('#results-done').onclick = closeResults;

    $('#search-form').onsubmit = async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      const results = $('#results');
      try {
        const id = youtubeId(text);
        if (id) {
          closeResults(); // clear now so another link can be pasted meanwhile
          const song = await songFromLink(id);
          if (!song) return toast('Can\'t add that video (private, removed or not embeddable)');
          await enqueue(song);
          return;
        }
        if (!searchEnabled) return toast('Search isn\'t set up. Paste a YouTube link instead');
        input.blur(); // hide the keyboard so results are visible
        $('#results-title').textContent = `Results for “${text}”`;
        found = null;
        results.replaceChildren(...skeletonRows(5));
        results.setAttribute('aria-busy', 'true');
        showResults(true);
        window.scrollTo({ top: 0 });
        found = await search(text);
        results.removeAttribute('aria-busy');
        renderResults();
      } catch (err) {
        console.error(err);
        showResults(false);
        $('#results').removeAttribute('aria-busy');
        toast(/quota/i.test(err.message) ? 'Daily search quota used up. Paste a YouTube link instead' : `Error: ${err.message}`);
      }
    };
  </script>
</body>
</html>
